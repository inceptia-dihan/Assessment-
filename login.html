<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In | ByteSpace</title>
  <meta name="description" content="Sign in to your ByteSpace account to access world-class creative courses and connect with fellow creators." />

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-page-body">

  <!-- Top Logo Mark Bar -->
  <header class="auth-top-bar">
    <div class="auth-nav-container">
      <a href="index.html" class="auth-brand-logo" id="auth-brand-logo" aria-label="ByteSpace Home">
        <svg class="auth-logo-icon" width="28" height="30" viewBox="0 0 20 22" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M1 4.5L5.5 1H8V8.2C9.5 7.4 11.2 7 13 7C16.866 7 20 10.134 20 14C20 17.866 16.866 21 13 21H6C3.23858 21 1 18.7614 1 16V4.5ZM8 11.5V16.5L12.5 14L8 11.5Z" fill="#C8F902"/>
        </svg>
      </a>
    </div>
  </header>

  <!-- Main Auth Wrapper -->
  <main class="auth-main-wrapper">
    <div class="auth-container">
      
      <!-- Left Column: Copy & Floating Showcase -->
      <section class="auth-left-col">
        <div class="auth-intro-header">
          <h1 class="auth-heading">Sign in with ease</h1>
          <p class="auth-subheading">
            Experience a seamless and efficient sign-in process that<br class="desktop-br" />
            grants you instant access to a world of knowledge.
          </p>
        </div>

        <div class="auth-visual-wrapper">
          <img 
            src="images/auth-showcase-visual.png" 
            alt="ByteSpace Courses & Happy Students Showcase" 
            class="auth-showcase-image" 
            id="auth-showcase-image"
          />
        </div>
      </section>

      <!-- Right Column: White Floating Card -->
      <section class="auth-right-col">
        <div class="auth-card" id="auth-card">
          <span class="auth-card-badge">Sign In</span>
          <h2 class="auth-card-heading">Welcome Back</h2>

          <form class="auth-form" id="auth-signin-form" onsubmit="event.preventDefault(); handleAuthSubmit('signin');">
            <div class="auth-form-group">
              <label for="signin-email" class="auth-field-label">Email</label>
              <input 
                type="email" 
                id="signin-email" 
                name="email" 
                class="auth-text-input" 
                placeholder="designer@example.com" 
                required 
              />
            </div>

            <div class="auth-form-group">
              <label for="signin-password" class="auth-field-label">Password</label>
              <input 
                type="password" 
                id="signin-password" 
                name="password" 
                class="auth-text-input" 
                placeholder="********" 
                required 
              />
            </div>

            <div class="auth-submit-row">
              <button type="submit" class="auth-action-btn" id="auth-signin-btn">
                Sign In
              </button>
            </div>
          </form>

          <div class="auth-or-divider">
            <span>or</span>
          </div>

          <!-- Social Login Circle Buttons -->
          <div class="auth-social-group">
            <button type="button" class="auth-social-circle-btn" id="social-fb-btn" aria-label="Sign in with Facebook" onclick="handleSocialAuth('Facebook')">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
              </svg>
            </button>
            <button type="button" class="auth-social-circle-btn" id="social-google-btn" aria-label="Sign in with Google" onclick="handleSocialAuth('Google')">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10c5.52 0 10-4.48 10-10 0-.69-.07-1.35-.2-2H12v4.2h5.75c-.53 2.1-2.4 3.6-4.75 3.6-2.76 0-5-2.24-5-5s2.24-5 5-5c1.22 0 2.33.44 3.19 1.17l3.14-3.14C17.38 3.09 14.86 2 12 2z"/>
              </svg>
            </button>
          </div>

          <div class="auth-footer-prompt">
            <span class="auth-footer-note">New user?</span>
            <a href="register.html" class="auth-switch-link" id="goto-register-link">Create an account</a>
          </div>
        </div>
      </section>

    </div>
  </main>

  <!-- Interactive Toast Notification -->
  <div class="toast-notification" id="toast-notification"></div>

  <script src="script.js"></script>
</body>
</html>
